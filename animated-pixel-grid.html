<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="dark" />
        <title>Animated Noise Pixel Field</title>
        <style>
            :root {
                color-scheme: dark;
                --background: #0a0908;
                --foreground: #f6f4f1;
                --muted: #a19b96;
                --pixel: 7px;
                --gap: 12px;
            }

            * {
                box-sizing: border-box;
            }
            html,
            body {
                min-height: 100%;
                margin: 0;
            }
            body {
                background: var(--background);
                color: var(--foreground);
                font-family:
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    sans-serif;
                overflow-x: hidden;
            }

            .hero {
                isolation: isolate;
                position: relative;
                min-height: 100svh;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                justify-content: center;
                padding: clamp(28px, 7vw, 88px);
            }

            #pixel-grid {
                position: absolute;
                z-index: -1;
                inset: 0;
                width: 100%;
                height: 100%;
                pointer-events: none;
                opacity: 0.95;
            }

            /* Vignette keeps the center text readable while pixels remain visible at the edges. */
            .vignette {
                position: absolute;
                z-index: -1;
                inset: 0;
                pointer-events: none;
                /* Keep the whole moving field visible, with only a mild contrast veil. */
                background: linear-gradient(
                    0deg,
                    rgba(10, 9, 8, 0.18),
                    rgba(10, 9, 8, 0.04) 48%,
                    rgba(10, 9, 8, 0.12)
                );
            }

            .topbar {
                position: absolute;
                top: clamp(22px, 4vw, 42px);
                left: clamp(28px, 7vw, 88px);
                right: clamp(28px, 7vw, 88px);
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
            }

            .mark {
                display: flex;
                align-items: center;
                gap: 5px;
                transform: skewY(-15deg);
            }
            .mark span {
                display: block;
                width: 26px;
                height: 9px;
                border-radius: 2px;
                background: #f5f2ef;
            }
            .mark span:nth-child(2) {
                transform: translateY(6px);
            }
            .mark span:nth-child(3) {
                transform: translateY(12px);
            }

            .content {
                width: min(760px, 100%);
                padding-top: 42px;
            }

            h1 {
                margin: 0;
                max-width: 820px;
                font-size: clamp(48px, 8.5vw, 104px);
                line-height: 0.96;
                letter-spacing: -0.075em;
                font-weight: 500;
            }
            h1 em {
                display: block;
                margin-top: 8px;
                color: #bcb4ac;
                font-family: Georgia, 'Times New Roman', serif;
                font-weight: 400;
                font-size: 0.89em;
                letter-spacing: -0.06em;
            }
            p {
                max-width: 510px;
                margin: 28px 0 0;
                color: var(--muted);
                font-size: clamp(17px, 2vw, 22px);
                line-height: 1.65;
            }
            .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                margin-top: 34px;
            }
            .button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-height: 46px;
                padding: 0 17px;
                border-radius: 10px;
                text-decoration: none;
                font-size: 14px;
                font-weight: 550;
                border: 1px solid rgba(255, 255, 255, 0.17);
                color: #eee9e4;
                background: rgba(255, 255, 255, 0.055);
            }
            .button.primary {
                background: #e8e2dc;
                color: #181513;
                border-color: #e8e2dc;
            }

            @media (max-width: 560px) {
                .hero {
                    justify-content: flex-start;
                    padding-top: 34svh;
                }
                .content {
                    padding-top: 0;
                }
                .vignette {
                    background: linear-gradient(
                        180deg,
                        rgba(10, 9, 8, 0.1),
                        rgba(10, 9, 8, 0.16) 45%,
                        rgba(10, 9, 8, 0.08)
                    );
                }
                .topbar {
                    align-items: flex-start;
                }
                .mark span {
                    width: 20px;
                }
                .hint {
                    display: none;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                #pixel-grid {
                    opacity: 0.8;
                }
            }
        </style>
    </head>
    <body>
        <main class="hero">
            <canvas id="pixel-grid" aria-hidden="true"></canvas>
            <div class="vignette" aria-hidden="true"></div>

            <header class="topbar">
                <div class="mark" aria-label="Brand mark">
                    <span></span><span></span><span></span>
                </div>
            </header>

            <section class="content">
                <h1>Make pixels <em>move.</em></h1>
                <p>
                    A living field of smooth, drifting noise. Each pixel carries
                    its own intensity, so the pattern feels layered instead of
                    flat.
                </p>
                <div class="actions">
                    <a class="button primary" href="#" id="toggle"
                        >Pause animation</a
                    >
                    <a class="button" href="#" id="regenerate"
                        >Change pattern</a
                    >
                </div>
            </section>
        </main>

        <script>
            (() => {
                const canvas = document.querySelector('#pixel-grid');
                const ctx = canvas.getContext('2d', { alpha: true });
                const toggleButton = document.querySelector('#toggle');
                const regenerateButton = document.querySelector('#regenerate');
                const reduceMotion = window.matchMedia(
                    '(prefers-reduced-motion: reduce)',
                );

                let width = 0,
                    height = 0,
                    dpr = 1;
                let raf = 0;
                let running = !reduceMotion.matches;
                let time = 0;
                let lastTime = 0;
                let seed = 1;
                let cells = [];

                // Tweak these to control density and movement speed.
                const spacing = 16;
                const pixelSize = 10;
                const animationSpeed = 4; // 1 = original speed; 1.5 = 1.5x faster
                let noiseScale = 500;

                function random01(n) {
                    // Stable pseudo-random value per cell: no per-frame flicker.
                    const x =
                        Math.sin(n * 127.1 + seed * 311.7) * 43758.5453123;
                    return x - Math.floor(x);
                }

                function hash(ix, iy) {
                    // Integer hashing is cheaper than Math.sin for the many noise samples per frame.
                    let n =
                        (Math.imul(ix, 374761393) +
                            Math.imul(iy, 668265263) +
                            Math.imul(seed, 2246822519)) |
                        0;
                    n = Math.imul(n ^ (n >>> 13), 1274126177);
                    n ^= n >>> 16;
                    return (n >>> 0) / 4294967295;
                }

                const mix = (a, b, t) => a + (b - a) * t;
                const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
                const clamp01 = (n) => Math.max(0, Math.min(1, n));

                // Smooth, continuous value noise. Adjacent cells sample the same field,
                // so shapes flow organically rather than appearing as random twinkles.
                function valueNoise(x, y) {
                    const x0 = Math.floor(x),
                        y0 = Math.floor(y);
                    const x1 = x0 + 1,
                        y1 = y0 + 1;
                    const u = fade(x - x0),
                        v = fade(y - y0);
                    const a = hash(x0, y0),
                        b = hash(x1, y0);
                    const c = hash(x0, y1),
                        d = hash(x1, y1);
                    return mix(mix(a, b, u), mix(c, d, u), v);
                }

                // Fractal Brownian motion combines broad blobs with finer details.
                function fbm(x, y) {
                    let value = 0;
                    let amplitude = 0.55;
                    let totalAmplitude = 0;
                    let frequency = 1;
                    for (let octave = 0; octave < 4; octave++) {
                        value +=
                            valueNoise(x * frequency, y * frequency) *
                            amplitude;
                        totalAmplitude += amplitude;
                        frequency *= 2.03;
                        amplitude *= 0.5;
                    }
                    return value / totalAmplitude;
                }

                function smoothstep(a, b, x) {
                    const t = clamp01((x - a) / (b - a));
                    return t * t * (3 - 2 * t);
                }

                function resize() {
                    const rect = canvas.getBoundingClientRect();
                    dpr = Math.min(window.devicePixelRatio || 1, 2);
                    width = rect.width;
                    height = rect.height;
                    canvas.width = Math.round(width * dpr);
                    canvas.height = Math.round(height * dpr);
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                    // Scale blob size gently with the canvas, while keeping mobile shapes visible.
                    noiseScale = Math.max(125, Math.min(270, width * 0.38));
                    cells = [];
                    const cols = Math.ceil(width / spacing) + 2;
                    const rows = Math.ceil(height / spacing) + 2;
                    for (let row = -1; row < rows; row++) {
                        for (let col = -1; col < cols; col++) {
                            const id = (row + 1) * 10007 + col + 1;
                            cells.push({
                                x: col * spacing,
                                y: row * spacing,
                                n: random01(id),
                                size:
                                    pixelSize *
                                    (0.94 + random01(id + 31) * 0.12),
                                phase: random01(id + 97) * Math.PI * 2,
                            });
                        }
                    }
                    paint();
                }

                function paint() {
                    ctx.clearRect(0, 0, width, height);

                    for (const cell of cells) {
                        // A shared moving noise field is sampled at every fixed grid position.
                        // Domain warping bends it into soft, lava-lamp-like continents.
                        const x = cell.x / noiseScale;
                        const y = cell.y / noiseScale;
                        const t = time;

                        const warpX = fbm(
                            x + 5.7 + t * 0.12,
                            y - 2.4 - t * 0.075,
                        );
                        const warpY = fbm(
                            x - 8.1 - t * 0.082,
                            y + 11.3 + t * 0.105,
                        );
                        const warpedX = x + (warpX - 0.5) * 2.15;
                        const warpedY = y + (warpY - 0.5) * 2.15;

                        const broad = fbm(
                            warpedX + t * 0.025,
                            warpedY - t * 0.018,
                        );
                        const detail = fbm(
                            x * 1.72 + 19.2 - t * 0.045,
                            y * 1.72 - 7.8 + t * 0.032,
                        );
                        const field = clamp01(broad * 0.82 + detail * 0.18);

                        // Field height controls brightness. The inner core is brighter, while
                        // the soft contour band suggests a raised edge and gives the field depth.
                        // Large areas below the threshold are genuinely black (0% brightness),
                        // creating breathing room instead of a wall of always-visible squares.
                        const visibility = smoothstep(0.43, 0.56, field);
                        const body = smoothstep(0.48, 0.72, field);
                        const core = smoothstep(0.64, 0.84, field);
                        const contour = Math.exp(
                            -Math.pow((field - 0.59) / 0.075, 2),
                        );
                        const fineLight = smoothstep(0.48, 0.88, detail);

                        const brightness = clamp01(
                            body * 0.48 + core * 0.4 + fineLight * 0.12,
                        );
                        const alpha =
                            visibility *
                            Math.min(
                                0.3,
                                0.018 +
                                    body * 0.075 +
                                    core * 0.085 +
                                    contour * 0.025,
                            );
                        if (alpha < 0.004) continue;

                        // Intensity is encoded in both opacity and luminance for a stronger depth cue.
                        const r = Math.round(54 + brightness * 132);
                        const g = Math.round(51 + brightness * 124);
                        const b = Math.round(48 + brightness * 116);
                        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                        ctx.fillRect(cell.x, cell.y, cell.size, cell.size);

                        // Only the brightest cells receive a subtle top-edge glint.
                        if (brightness > 0.78 && cell.n > 0.48) {
                            ctx.fillStyle = `rgba(235, 225, 213, ${Math.min(0.075, (brightness - 0.78) * 0.22)})`;
                            ctx.fillRect(
                                cell.x,
                                cell.y,
                                cell.size,
                                Math.max(1, cell.size * 0.1),
                            );
                        }
                    }
                }

                function frame(now) {
                    if (!running) return;
                    const dt = lastTime ? Math.min(now - lastTime, 40) : 16;
                    lastTime = now;
                    time += dt * 0.00034 * animationSpeed;
                    paint();
                    raf = requestAnimationFrame(frame);
                }

                function stop() {
                    running = false;
                    cancelAnimationFrame(raf);
                    raf = 0;
                    lastTime = 0;
                    paint();
                    toggleButton.textContent = 'Resume animation';
                }

                function start() {
                    if (running) return;
                    running = true;
                    lastTime = 0;
                    toggleButton.textContent = 'Pause animation';
                    raf = requestAnimationFrame(frame);
                }

                toggleButton.addEventListener('click', (event) => {
                    event.preventDefault();
                    running ? stop() : start();
                });

                regenerateButton.addEventListener('click', (event) => {
                    event.preventDefault();
                    seed += 1;
                    resize();
                });

                reduceMotion.addEventListener?.('change', (event) => {
                    event.matches ? stop() : start();
                });
                window.addEventListener('resize', resize, { passive: true });
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        cancelAnimationFrame(raf);
                        raf = 0;
                    } else if (running) {
                        lastTime = 0;
                        raf = requestAnimationFrame(frame);
                    }
                });

                resize();
                if (running) raf = requestAnimationFrame(frame);
                else toggleButton.textContent = 'Resume animation';
            })();
        </script>
    </body>
</html>
