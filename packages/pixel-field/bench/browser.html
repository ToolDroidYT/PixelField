<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PixelField browser bench</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0908;
        overflow: hidden;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 10;
        margin: 0;
        padding: 6px 8px;
        background: rgba(10, 9, 8, 0.75);
        color: #9f9;
        font:
          12px/1.45 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        white-space: pre;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="field"></canvas>
    <pre id="hud">starting…</pre>
    <script type="module">
      /**
       * Real-browser frame benchmark for the PixelField renderer.
       *
       * `bench/frame-cost.mjs` runs in Node against a mock canvas whose draw
       * calls are free, so it can only see the JavaScript side. This page runs
       * the same pipeline on a real <canvas> and records two signals:
       *
       *   paintMs — time inside `paintField` (scripting: noise, keys, sorting,
       *             fillStyle/fillRect issuing). Excludes raster/compositing.
       *   rafMs   — RAF-to-RAF interval, which *does* include rasterization,
       *             compositing, and anything else competing for the frame.
       *
       * Results land on `window.__result`; `window.__benchDone` flips true when
       * a run finishes, so an automation driver can await them.
       *
       * Query parameters:
       *   frames=300       measured frames after `warmup`
       *   warmup=60        discarded frames (JIT, first-paint allocation)
       *   mode=animated    `animated` advances the clock, `static` freezes it
       *   w, h, dpr        pin the canvas size and scale explicitly, so results
       *                    do not depend on the browser window's own geometry
       *   phase=full       `full` measures noise + keys + sort + draw;
       *                    `draw` measures only the drawing half
       *   strategy=rects   for `phase=draw`: `rects` (fillRect per cell) or
       *                    `paths` (one path per palette bucket)
       *   seed=18
       *   label=text       echoed back in the result
       *   octaves, warpOctaves, renderScale, quality, spacing, maxCells,
       *   warpAmount, pixelSize   — passed straight to `resolvePixelFieldConfig`
       *
       * Serve the package root over HTTP (ES modules do not load from file://):
       *   python3 -m http.server 4173 --directory packages/pixel-field
       *
       * Loads `bench/dist/bench.js` (the React-free entry) rather than
       * `dist/index.js`, whose bare `react` import no plain page can resolve.
       */
      import {
        buildFieldCells,
        createFieldRenderBuffers,
        paintField,
        resolvePixelFieldConfig,
      } from './dist/bench.js';

      const params = new URLSearchParams(location.search);
      const number = (key) => {
        const raw = params.get(key);
        if (raw === null) return undefined;
        const value = Number(raw);
        return Number.isFinite(value) ? value : undefined;
      };

      const FRAMES = number('frames') ?? 300;
      const WARMUP = number('warmup') ?? 60;
      const MODE = params.get('mode') ?? 'animated';
      const SEED = number('seed') ?? 18;
      const LABEL =
        params.get('label') ?? (location.search.slice(1) || 'default');

      /**
       * `phase=full` (default) measures the whole pipeline. `phase=draw` runs
       * `paintField` once to populate the buffers, then measures only the
       * drawing half each frame — which is how `strategy` gets compared
       * without the noise cost drowning it out.
       */
      const PHASE = params.get('phase') ?? 'full';
      const STRATEGY = params.get('strategy') ?? 'rects';

      /** Base clock step per millisecond — mirrors `usePixelField`. */
      const TIME_STEP = 0.00136;

      const overrides = {};
      for (const key of [
        'octaves',
        'warpOctaves',
        'renderScale',
        'quality',
        'spacing',
        'pixelSize',
        'maxCells',
        'warpAmount',
      ]) {
        const value = number(key);
        if (value !== undefined) overrides[key] = value;
      }
      const quality = params.get('quality');
      if (quality) overrides.quality = quality;

      const config = resolvePixelFieldConfig(overrides);
      const canvas = document.getElementById('field');
      const hud = document.getElementById('hud');
      const ctx = canvas.getContext('2d', { alpha: true });

      // `w`/`h`/`dpr` pin the canvas explicitly, which makes runs reproducible
      // regardless of the browser window's actual size or scale factor.
      const cssWidth = number('w') ?? window.innerWidth;
      const cssHeight = number('h') ?? window.innerHeight;
      const renderScale = config.renderScale ?? 1;
      const dpr =
        number('dpr') ??
        Math.min(window.devicePixelRatio || 1, Math.max(1, config.maxDpr)) *
          renderScale;

      if (number('w') !== undefined || number('h') !== undefined) {
        canvas.style.width = `${cssWidth}px`;
        canvas.style.height = `${cssHeight}px`;
      }

      canvas.width = Math.max(1, Math.round(cssWidth * dpr));
      canvas.height = Math.max(1, Math.round(cssHeight * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const cells = buildFieldCells(cssWidth, cssHeight, config, SEED);
      const buffers = createFieldRenderBuffers(cells.count);
      const baseNoiseScale =
        config.noiseScale === 'auto'
          ? Math.max(
              config.autoScaleMin,
              Math.min(config.autoScaleMax, cssWidth * config.autoScaleFactor),
            )
          : config.noiseScale;
      const noiseScale = baseNoiseScale * cells.scale;

      const view = {
        width: cssWidth,
        height: cssHeight,
        noiseScale,
        time: 0,
        seed: SEED,
      };

      /**
       * Repaints from the prepared buffers, using either per-cell `fillRect`
       * (what ships) or one path per palette bucket. Both walk the identical
       * bucket list in the identical order, so the pixels drawn are the same.
       */
      const drawPrepared = () => {
        const { counts, offsets, order, bodyUsed, glintUsed, palette } =
          buffers;
        const usedSets = [
          [bodyUsed, buffers.bodyUsedCount, false],
          [glintUsed, buffers.glintUsedCount, true],
        ];
        ctx.clearRect(0, 0, cssWidth, cssHeight);

        for (const [used, usedCount, isGlint] of usedSets) {
          for (let u = 0; u < usedCount; u++) {
            const key = used[u];
            const style = palette[key];
            if (style === undefined) continue;
            const end = offsets[key];
            const start = end - counts[key];
            ctx.fillStyle = style;

            if (STRATEGY === 'paths') {
              ctx.beginPath();
              for (let j = start; j < end; j++) {
                const i = order[j];
                const size = cells.size[i];
                ctx.rect(
                  cells.x[i],
                  cells.y[i],
                  size,
                  isGlint ? Math.max(1, size * config.glintHeightRatio) : size,
                );
              }
              ctx.fill();
            } else {
              for (let j = start; j < end; j++) {
                const i = order[j];
                const size = cells.size[i];
                ctx.fillRect(
                  cells.x[i],
                  cells.y[i],
                  size,
                  isGlint ? Math.max(1, size * config.glintHeightRatio) : size,
                );
              }
            }
          }
        }
      };

      if (PHASE === 'draw') {
        // Populate keys, buckets and palette once; only drawing repeats.
        paintField(ctx, cells, buffers, view, config);
      }

      const paintSamples = [];
      const rafSamples = [];
      let frame = 0;
      let previous = 0;
      let time = 0;
      let drawn = 0;

      const percentile = (values, p) => {
        if (values.length === 0) return 0;
        const sorted = [...values].sort((a, b) => a - b);
        return sorted[
          Math.min(sorted.length - 1, Math.floor(p * sorted.length))
        ];
      };

      /**
       * Display refresh period, measured with empty callbacks *before* the
       * bench runs. Deriving it from the bench's own samples would be circular:
       * once every frame is slow the median interval is the degraded one, and
       * the drop rate then reads near zero.
       */
      const probeRefresh = async () => {
        let previousRaf = 0;
        let min = Infinity;
        for (let i = 0; i < 45; i++) {
          await new Promise((resolve) =>
            requestAnimationFrame((now) => {
              if (previousRaf) min = Math.min(min, now - previousRaf);
              previousRaf = now;
              resolve();
            }),
          );
        }
        return Number.isFinite(min) && min > 0 ? min : 16.67;
      };

      const tick = (now) => {
        if (previous) rafSamples.push(now - previous);
        previous = now;

        if (MODE === 'animated') time += (1000 / 60) * TIME_STEP;
        view.time = time;

        const start = performance.now();
        if (PHASE === 'draw') drawPrepared();
        else paintField(ctx, cells, buffers, view, config);
        const paintMs = performance.now() - start;

        if (frame >= WARMUP) paintSamples.push(paintMs);
        frame++;

        if (frame % 10 === 0) {
          hud.textContent =
            `${LABEL}\n` +
            `frame ${frame - WARMUP}/${FRAMES}\n` +
            `paint p50 ${percentile(paintSamples, 0.5).toFixed(2)} ms  ` +
            `raf p50 ${percentile(rafSamples, 0.5).toFixed(1)} ms`;
        }

        if (frame - WARMUP >= FRAMES) {
          for (let i = 0; i < buffers.bodyKeys.length; i++) {
            if (buffers.bodyKeys[i] >= 0) drawn++;
          }

          const period = refreshPeriod;
          const dropped = rafSamples.filter((v) => v > period * 1.5).length;
          const severe = rafSamples.filter((v) => v > period * 2.5).length;
          const result = {
            label: LABEL,
            viewport: `${cssWidth}x${cssHeight}`,
            dpr: Number(dpr.toFixed(3)),
            mode: MODE,
            phase: PHASE,
            strategy: STRATEGY,
            cells: cells.count,
            drawn,
            frames: paintSamples.length,
            paintP50: Number(percentile(paintSamples, 0.5).toFixed(3)),
            paintP95: Number(percentile(paintSamples, 0.95).toFixed(3)),
            rafP50: Number(percentile(rafSamples, 0.5).toFixed(2)),
            rafP95: Number(percentile(rafSamples, 0.95).toFixed(2)),
            periodMs: Number(period.toFixed(2)),
            // `period` is the observed refresh interval (16.7 ms at 60 Hz,
            // 8.3 ms at 120 Hz), so the drop thresholds track the display
            // instead of assuming one — a raw `>16.67` cut counts the normal
            // quantized 16.70 ms interval as a missed frame.
            droppedPct: Number(
              ((100 * dropped) / Math.max(1, rafSamples.length)).toFixed(1),
            ),
            severePct: Number(
              ((100 * severe) / Math.max(1, rafSamples.length)).toFixed(1),
            ),
            config: {
              octaves: config.octaves,
              warpOctaves: config.warpOctaves,
              renderScale: config.renderScale,
              quality: config.quality,
              spacing: config.spacing,
            },
          };
          window.__result = result;
          window.__benchDone = true;
          hud.textContent =
            `${LABEL} — done\n` +
            `paint p50 ${result.paintP50} ms  p95 ${result.paintP95} ms\n` +
            `raf p50 ${result.rafP50} ms  p95 ${result.rafP95} ms\n` +
            `dropped ${result.droppedPct}%  long ${result.severePct}%\n` +
            `${result.cells} cells, ${result.drawn} drawn`;
          return;
        }

        requestAnimationFrame(tick);
      };

      let refreshPeriod = 16.67;

      probeRefresh().then((period) => {
        refreshPeriod = period;
        requestAnimationFrame(tick);
      });
    </script>
  </body>
</html>
